services:
  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_PATH: /app/data/qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - huggingface-cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  huggingface-cache:

